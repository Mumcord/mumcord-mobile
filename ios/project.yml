# SPDX-License-Identifier: AGPL-3.0-only
#
# XcodeGen description of the iOS app. `scripts/build-ios.sh` builds the bridge, generates the
# Swift bindings and then turns this file into `Mumcord.xcodeproj` (which is not committed).
#
# No development team and no signing identity in here: simulator builds are signed locally by
# Xcode ("Sign to Run Locally"); release signing comes from CI secrets.
name: Mumcord

options:
  bundleIdPrefix: app.mumcord
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES

targets:
  # The Swift module `MumcordBridge`: the generated UniFFI bindings plus the Rust library.
  MumcordBridge:
    type: framework
    platform: iOS
    sources:
      - path: Bridge/Generated
    dependencies:
      # Static Rust library with the C header module `MumcordBridgeFFI`.
      - framework: Bridge/MumcordBridge.xcframework
        embed: false
      # A static Rust library does not carry the list of system frameworks it needs.
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      - sdk: CoreAudio.framework
      # Network path monitoring and the system's DNS resolver settings.
      - sdk: Network.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mumcord.mobile.bridge
        # The four audio functions of bridge/include/mumcord_audio.h are called by the app's C
        # code, not by the Swift bindings. Nothing in this framework refers to them, so the
        # linker would leave them out of it without being told to keep them.
        OTHER_LDFLAGS:
          - "-Wl,-u,_mumcord_audio_capture_push_i16"
          - "-Wl,-u,_mumcord_audio_capture_push_f32"
          - "-Wl,-u,_mumcord_audio_playback_pull_i16"
          - "-Wl,-u,_mumcord_audio_playback_pull_f32"

  Mumcord:
    type: application
    platform: iOS
    sources:
      - path: Mumcord
      - path: Platform
    # Mumcord/Design/Generated (tokens, icons, fonts) comes from design/*.json. The folder is
    # filled by scripts/build-ios.sh before this project is generated, so its files are part of
    # the target; this phase refreshes them before every compile when the JSON changed.
    preBuildScripts:
      - name: Generate design tokens and icons
        basedOnDependencyAnalysis: false
        script: |
          if ! command -v python3 >/dev/null; then
            echo "error: python3 not found; it is needed to generate the design tokens (it ships with the Xcode command line tools)" >&2
            exit 1
          fi
          python3 "${SRCROOT}/Tools/generate_design.py"
    dependencies:
      - target: MumcordBridge
      # The audio unit and the audio session of voice (Platform/Audio).
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      # Asks the system whether it refuses local network access.
      - sdk: Network.framework
    # Keys that have no INFOPLIST_KEY_ build setting. The file is written by XcodeGen into the
    # git-ignored build folder and merged with the generated keys below.
    info:
      path: build/Mumcord-Info.plist
      properties:
        # mumble:// links open the app, which shows their target and asks before connecting.
        CFBundleURLTypes:
          - CFBundleURLName: app.mumcord.mobile.mumble
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [mumble]
        # Without this sentence iOS blocks connections to servers on the local network.
        NSLocalNetworkUsageDescription: Mumcord connects to Mumble servers on your local network.
        # Without this sentence iOS ends the app when the camera opens to take a photo for the chat.
        NSCameraUsageDescription: Mumcord uses the camera when you take a photo to send in a chat.
        # Without this sentence iOS ends the app when it asks for the microphone.
        NSMicrophoneUsageDescription: Mumcord needs the microphone so that the others can hear you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mumcord.mobile
        # The phase above reads design/ outside the project folder and writes source files.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The C code of the audio unit (Platform/Audio) and the engine's audio functions it calls.
        SWIFT_OBJC_BRIDGING_HEADER: Platform/Audio/Mumcord-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../bridge/include"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Mumcord
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # Runs inside the app: the Keychain is only available to code hosted by an app.
  MumcordTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: Mumcord

  MumcordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Mumcord

schemes:
  Mumcord:
    build:
      targets:
        Mumcord: all
        MumcordTests: [test]
        MumcordUITests: [test]
    test:
      targets:
        - MumcordTests
        - MumcordUITests
