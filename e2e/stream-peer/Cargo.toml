# SPDX-License-Identifier: AGPL-3.0-only

# The second person of the end-to-end stream and camera tests: an engine of its own on the host
# that shares the engine's moving test pattern (VP9), as a desktop app shares a screen, or watches
# the phone's camera and checks its pictures. Only e2e/run.sh builds it,
# with the `sharer` feature, which needs libvpx on the host; without the feature (a workspace
# build, CI) it builds without any C library and only says so when started.
[package]
name = "mumcord-stream-peer"
description = "Screen sharer and camera viewer for the end-to-end stream tests of the mobile apps"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "stream-peer"
path = "src/main.rs"

[features]
sharer = ["mumcord-engine/vp9", "mumcord-engine/test-backend"]

[dependencies]
mumcord-engine.workspace = true
mumcord-store.workspace = true
tokio = { version = "1.54", features = ["rt-multi-thread", "io-std", "io-util", "macros", "time"] }
