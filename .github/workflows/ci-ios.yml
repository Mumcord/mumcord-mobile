# SPDX-License-Identifier: AGPL-3.0-only
#
# Builds the Rust bridge for iOS, generates the Xcode project and runs the app's unit and UI
# tests in the simulator.
name: CI iOS

on:
  pull_request:
    paths: &ios-paths
      - "ios/**"
      - "design/**"
      - "bridge/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine.lock.toml"
      - "rust-toolchain.toml"
      - "scripts/build-ios.sh"
      - ".github/workflows/ci-ios.yml"
  push:
    branches: [main]
    paths: *ios-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Naming the shell turns on `pipefail`: without it a failing build piped into `tee` passes.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Must exist in the Xcode of the runner image below.
  IOS_SIMULATOR: iPhone 17

jobs:
  ios:
    name: Build and test in the simulator
    # A fixed image instead of macos-latest: the Xcode version decides which simulators exist.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: brew install xcodegen cmake
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      # Version, components and targets come from rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build and test
        run: scripts/build-ios.sh --test 2>&1 | tee "$RUNNER_TEMP/build-ios.log"

      # The UI tests attach screenshots of the first screen and of the channels reference screen
      # of the design system in dark and light; never the reason for a red run. The export names
      # the files by an id, so they are copied to the names the tests gave them.
      - name: Export the screenshots
        if: always()
        continue-on-error: true
        run: |
          xcrun xcresulttool export attachments \
            --path ios/build/TestResults.xcresult --output-path "$RUNNER_TEMP/attachments"
          python3 - "$RUNNER_TEMP/attachments" "$RUNNER_TEMP/screenshots" <<'PY'
          import json, re, shutil, sys
          from pathlib import Path

          source, target = Path(sys.argv[1]), Path(sys.argv[2])
          target.mkdir(parents=True, exist_ok=True)
          for test in json.loads((source / "manifest.json").read_text()):
              for attachment in test.get("attachments", []):
                  exported = attachment["exportedFileName"]
                  # "first-screen_0_<uuid>.png" becomes "first-screen.png".
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(?=\.\w+$)", "", attachment.get("suggestedHumanReadableName") or exported)
                  # Attachments of a failed test are named after the failure; keep only
                  # characters an artifact may contain.
                  name = re.sub(r"[^A-Za-z0-9._ -]", "_", name)
                  shutil.copyfile(source / exported, target / name)
                  print(f"{exported} -> {name}")
          PY

      - name: Upload test results, log and screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: |
            ios/build/TestResults.xcresult
            ${{ runner.temp }}/build-ios.log
            ${{ runner.temp }}/attachments
          if-no-files-found: warn
          retention-days: 14

      # Small and separate, so the screenshots can be fetched without the result bundle.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14
