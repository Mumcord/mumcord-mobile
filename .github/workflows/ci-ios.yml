# SPDX-License-Identifier: AGPL-3.0-only
#
# Builds the Rust bridge and the app for iOS once, then runs the unit and UI tests in parallel
# jobs, one per test group. The groups live in scripts/build-ios.sh (group_tests); the job
# "iOS" at the end is the one name for branch protection.
name: CI iOS

on:
  pull_request:
    paths: &ios-paths
      - "ios/**"
      - "design/**"
      - "bridge/**"
      - "i18n/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine.lock.toml"
      - "rust-toolchain.toml"
      - "scripts/build-ios.sh"
      - "scripts/build-codecs.sh"
      - "scripts/translations.py"
      - "scripts/test_translations.py"
      - "scripts/testenv.sh"
      - ".github/workflows/ci-ios.yml"
  push:
    branches: [main]
    paths: *ios-paths

permissions:
  contents: read

# One group per commit: every pushed commit gets a complete run of its own. A later push
# neither cancels a run that is in progress nor waits behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

# Naming the shell turns on `pipefail`: without it a failing build piped into `tee` passes.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # No IOS_SIMULATOR: scripts/build-ios.sh takes "iPhone 17" when the runner has it and another
  # available iPhone simulator when not; a fixed name would fail on a runner without it.

jobs:
  # Fails at once when a UI test class belongs to no group or the translated texts are out of
  # date, and hands the groups to the matrix.
  groups:
    name: Test groups
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that every test class has a group
        run: scripts/build-ios.sh --check-groups

      # The translated texts must follow the app's English texts and the desktop translations
      # of the pinned engine commit (scripts/translations.py), as in ci-android.yml.
      - name: Check the translations
        run: |
          scripts/testenv.sh fetch
          python3 -B -m unittest discover -s scripts -p 'test_translations.py'
          python3 -B scripts/translations.py check

      - id: list
        run: echo "matrix=$(scripts/build-ios.sh --list-groups)" >> "$GITHUB_OUTPUT"

  build:
    name: Build for testing
    needs: groups
    # A fixed image instead of macos-latest: the Xcode version decides which simulators exist.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: brew install xcodegen cmake meson ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      # Version, components and targets come from rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The video codecs of device and simulator, built once per codec version, build script and
      # Xcode; scripts/build-ios.sh calls scripts/build-codecs.sh, which keeps a current build.
      - name: Name the video codec build
        id: codecs
        run: echo "id=$(scripts/build-codecs.sh --id aarch64-apple-ios)" >> "$GITHUB_OUTPUT"

      - name: Cache the video codecs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .codecs
          key: codecs-ios-${{ steps.codecs.outputs.id }}

      - name: Build the app and its tests
        run: scripts/build-ios.sh --build-for-testing 2>&1 | tee "$RUNNER_TEMP/build-ios.log"

      # One archive instead of thousands of files: the artifact upload is much faster, and the
      # symbolic links inside the frameworks survive.
      - name: Pack the test products
        run: tar -C ios/build -czf "$RUNNER_TEMP/Mumcord.xctestproducts.tar.gz" Mumcord.xctestproducts

      - name: Upload the test products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-products
          path: ${{ runner.temp }}/Mumcord.xctestproducts.tar.gz
          # Already compressed.
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/build-ios.log
          if-no-files-found: warn
          retention-days: 14

  test:
    name: Test ${{ matrix.group }}
    needs: [groups, build]
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the test products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-test-products
          path: ${{ runner.temp }}/products

      - name: Unpack the test products
        run: |
          mkdir -p ios/build
          tar -C ios/build -xzf "$RUNNER_TEMP/products/Mumcord.xctestproducts.tar.gz"

      - name: Run the tests
        run: scripts/build-ios.sh --test-without-building "${{ matrix.group }}" 2>&1 | tee "$RUNNER_TEMP/test-${{ matrix.group }}.log"

      # The UI tests attach screenshots of the first screen and of the channels reference screen
      # of the design system in dark and light; never the reason for a red run. The export names
      # the files by an id, so they are copied to the names the tests gave them.
      - name: Export the screenshots
        if: always()
        continue-on-error: true
        run: |
          xcrun xcresulttool export attachments \
            --path ios/build/TestResults-${{ matrix.group }}.xcresult --output-path "$RUNNER_TEMP/attachments"
          python3 - "$RUNNER_TEMP/attachments" "$RUNNER_TEMP/screenshots" <<'PY'
          import json, re, shutil, sys
          from pathlib import Path

          source, target = Path(sys.argv[1]), Path(sys.argv[2])
          target.mkdir(parents=True, exist_ok=True)
          for test in json.loads((source / "manifest.json").read_text()):
              for attachment in test.get("attachments", []):
                  exported = attachment["exportedFileName"]
                  # "first-screen_0_<uuid>.png" becomes "first-screen.png".
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(?=\.\w+$)", "", attachment.get("suggestedHumanReadableName") or exported)
                  # Attachments of a failed test are named after the failure; keep only
                  # characters an artifact may contain.
                  name = re.sub(r"[^A-Za-z0-9._ -]", "_", name)
                  shutil.copyfile(source / exported, target / name)
                  print(f"{exported} -> {name}")
          PY

      - name: Upload test results and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results-${{ matrix.group }}
          path: |
            ios/build/TestResults-${{ matrix.group }}.xcresult
            ${{ runner.temp }}/test-${{ matrix.group }}.log
            ${{ runner.temp }}/attachments
          if-no-files-found: warn
          retention-days: 14

      # Small and separate, so the screenshots can be fetched without the result bundle.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots-${{ matrix.group }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14

  # The one name for branch protection: green only when every part is.
  ios:
    name: iOS
    if: always()
    needs: [groups, build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the parts
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success ]] || exit 1
          done

      # All screenshots in one artifact, as before the split.
      - name: Collect the screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          pattern: ios-screenshots-*
          delete-merged: true
          retention-days: 14
