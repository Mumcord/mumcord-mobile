# SPDX-License-Identifier: AGPL-3.0-only
#
# Every build dependency of the Android app, pinned to an exact version.

[versions]
# Same NDK as scripts/setup-android.sh installs; Gradle uses it to strip the native libraries.
ndk = "30.0.16248370"
agp = "9.5.1"
# Must be the Kotlin version the Compose compiler plugin is released with.
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
lifecycle = "2.9.4"
# The generated UniFFI bindings call the native library through JNA.
jna = "5.19.1"
kotlinx-coroutines = "1.11.0"
# The Compose test library asks for an Espresso that is too old to run on current Android.
espresso = "3.7.0"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
junit = "4.13.2"
# JVM tests read the shared design files with it (the JSON classes in android.jar are stubs).
json = "20250517"
# Screenshot tests on the JVM: Robolectric draws the screens, Roborazzi writes and compares them.
robolectric = "4.18"
roborazzi = "1.79.0"
# Kotlin companion of the Rust crate rustls-platform-verifier-android. Must equal that crate's
# version in Cargo.lock (the build checks it); its files are pinned by checksum in
# gradle/verification-metadata.xml.
rustls-platform-verifier = "0.2.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
rustls-platform-verifier = { module = "org.rustls:rustls-platform-verifier", version.ref = "rustls-platform-verifier" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
