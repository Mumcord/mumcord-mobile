[package]
name = "mumcord-mobile-bridge"
description = "Mobile-friendly interface to the Mumcord engine with Kotlin and Swift bindings (UniFFI)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mumcord_mobile"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The binding generator for Kotlin and Swift. A host tool: never switched on for phone builds.
bindgen = ["uniffi/cli"]

[dependencies]
# Chat: the versions the engine already uses, so no second copy ends up in the library.
base64 = "0.23"
html5ever = "0.40"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mumcord-audio.workspace = true
mumcord-engine.workspace = true
mumcord-store.workspace = true
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync"] }
tracing = "0.1"
# Exact version: the generated Kotlin and Swift code must match the library it was built from.
uniffi = "=0.32.2"
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
# Same versions as the engine uses, so there is one verifier and one JNI layer in the library.
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "time"] }
