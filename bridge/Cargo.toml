[package]
name = "mumcord-mobile-bridge"
description = "Mobile-friendly interface to the Mumcord engine with Kotlin and Swift bindings (UniFFI)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mumcord_mobile"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The binding generator for Kotlin and Swift. A host tool: never switched on for phone builds.
bindgen = ["uniffi/cli"]
# The live stream test (`src/live_streams.rs`): a second engine shares the engine's test pattern
# and this machine decodes it, so it needs libvpx installed. Never on for the phones or in CI.
live-video = ["mumcord-engine/vp9", "mumcord-engine/test-backend"]

[dependencies]
# Chat: the versions the engine already uses, so no second copy ends up in the library.
base64 = "0.23"
# Random ids of the user's own themes; the version the engine already uses.
getrandom = "0.4"
html5ever = "0.40"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mumcord-audio.workspace = true
mumcord-engine.workspace = true
mumcord-store.workspace = true
# Markdown of typed messages. Exact version: what the user typed must turn into the same message
# with every build. Only the parser; the HTML is written by `chat::wire`.
pulldown-cmark = { version = "=0.13.6", default-features = false }
# Theme codes: JSON as the desktop writes it, names capped in visible characters like the
# desktop's grapheme count.
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync"] }
tracing = "0.1"
# Exact version: the generated Kotlin and Swift code must match the library it was built from.
uniffi = "=0.32.2"
unicode-segmentation = "1"
url = "2"

# The video codecs of streams (libvpx for VP9, dav1d for AV1), cross-built by
# scripts/build-codecs.sh. Only for the phones: builds for this machine (binding generator, tests,
# end-to-end helpers) stay free of the C libraries; without the features the engine keeps the same
# API and reports the codec as unavailable.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
mumcord-engine = { workspace = true, features = ["vp9", "av1-decode"] }

[target.'cfg(target_os = "android")'.dependencies]
# Same versions as the engine uses, so there is one verifier and one JNI layer in the library.
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "time"] }
